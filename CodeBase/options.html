<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Prompt Guard - Ayarlar</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 8px; }
    p { color: #555; }
    textarea { width: 100%; min-height: 220px; box-sizing: border-box; padding: 12px; font: inherit; }
    button { margin-top: 12px; padding: 10px 18px; cursor: pointer; }
    #status { margin-left: 12px; color: #087f23; }
  </style>
</head>
<body>
  <h1>Prompt Guard</h1>
  <p>Her satıra bir yasaklı kelime yazın.</p>

  <textarea id="words" placeholder="secret&#10;password&#10;api_key"></textarea>

  <br>
  <button id="save">Kaydet</button>
  <span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
